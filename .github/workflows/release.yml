name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set release version
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH.'
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" Info.plist

      - name: Check
        run: make check

      - name: Package
        run: |
          make app SIGNING_IDENTITY=-
          codesign --verify --deep --strict .local/dist/spale.app
          test "$(lipo -archs .local/dist/spale.app/Contents/MacOS/spale)" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' .local/dist/spale.app/Contents/Info.plist)" = "${RELEASE_TAG#v}"
          ditto -c -k --sequesterRsrc --keepParent .local/dist/spale.app ".local/dist/spale-${RELEASE_TAG}-macos-arm64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" ".local/dist/spale-${RELEASE_TAG}-macos-arm64.zip" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
