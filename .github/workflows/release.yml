name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Set package version
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo '::error::Release tags must use vMAJOR.MINOR.PATCH.'
              exit 1
            fi
            version="${RELEASE_TAG#v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" Info.plist
          else
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check
        run: make check

      - name: Package
        run: |
          make app SIGNING_IDENTITY=-
          xcrun vtool -show-build .local/dist/spale.app/Contents/MacOS/spale
          codesign --verify --deep --strict .local/dist/spale.app
          archs="$(lipo -archs .local/dist/spale.app/Contents/MacOS/spale)"
          echo "lipo: $archs"
          test "$archs" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' .local/dist/spale.app/Contents/Info.plist)" = "$PACKAGE_VERSION"
          ditto -c -k --sequesterRsrc --keepParent .local/dist/spale.app ".local/dist/spale-v${PACKAGE_VERSION}-macos-arm64.zip"

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" ".local/dist/spale-${RELEASE_TAG}-macos-arm64.zip" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes --latest
