name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify SemVer tag and tracked Info.plist
        run: |
          set -euo pipefail
          plist_short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          plist_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
          version="$plist_short"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
              echo '::error::Release tags must use vMAJOR.MINOR.PATCH with an optional -alpha.N, -beta.N, or -rc.N suffix.'
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          fi
          core="${version%%-*}"
          if ! [[ "$core" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "$plist_short" != "$core" || "$plist_build" != "$core" ]]; then
            echo "::error::Tracked Info.plist versions ($plist_short, $plist_build) must equal release core $core."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Check
        run: make check

      - name: Package
        run: |
          make app SIGNING_IDENTITY=-
          xcrun vtool -show-build .local/dist/spale.app/Contents/MacOS/spale
          codesign --verify --deep --strict .local/dist/spale.app
          archs="$(lipo -archs .local/dist/spale.app/Contents/MacOS/spale)"
          echo "lipo: $archs"
          test "$archs" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' .local/dist/spale.app/Contents/Info.plist)" = "${PACKAGE_VERSION%%-*}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' .local/dist/spale.app/Contents/Info.plist)" = "${PACKAGE_VERSION%%-*}"
          ditto -c -k --sequesterRsrc --keepParent .local/dist/spale.app ".local/dist/spale-v${PACKAGE_VERSION}-macos-arm64.zip"

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=".local/dist/release-notes.md"
          awk -v heading="## [${RELEASE_TAG#v}]" '
            found && /^## / { exit }
            index($0, heading " (") == 1 { found = 1 }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '^\* ' "$notes"; then
            echo "::error::CHANGELOG.md has no release notes for $RELEASE_TAG."
            exit 1
          fi
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$notes")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" ".local/dist/spale-${RELEASE_TAG}-macos-arm64.zip" "${args[@]}"
