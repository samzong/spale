<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Spale</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="layout.css">
  </head>
  <body>
    <section class="layout-study" aria-label="Prototype layout scenarios">
      <div class="study-controls">
        <label>Case <select id="study-case"><option value="demo">Interactive demo</option><option value="c01">C01 · Conflict banner</option><option value="c02">C02 · File path</option><option value="c03">C03 · Window bar</option></select></label>
        <label>Appearance <select id="study-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
        <details class="study-fixtures"><summary>Scenarios</summary><div>
          <label>Window width <select id="study-width"><option value="640">640 pt · 320 pt reader</option><option value="720">720 pt · 400 pt reader</option><option value="800">800 pt · 480 pt reader</option><option value="1040">1040 pt · 720 pt reader</option></select></label>
          <label>Open windows <select id="study-count"><option value="1">1</option><option value="5" selected>5</option><option value="10">10</option></select></label>
          <label>File path <select id="study-path"><option value="long">Long path</option><option value="mixed">Mixed Chinese and English</option><option value="renamed">Renamed path</option><option value="deleted">Deleted file</option><option value="unbroken">Long filename</option></select></label>
        </div></details>
        <button id="study-reset">Reset scene</button>
      </div>
      <p id="study-description"></p>
      <p class="study-scope">Prototype controls only. C01, C02 A, and C03 show the owner’s selected layouts.</p>
    </section>
    <div class="window" aria-label="Spale change reader">
      <header class="chrome">
        <div class="lights" aria-hidden="true">
          <i>
          </i>
          <i>
          </i>
          <i>
          </i>
        </div>
        <div class="workspace" id="workspace">Spale</div>
            <div class="chrome-main">
              <button id="back" class="icon" title="Back to changes (Esc)" aria-label="Back to changes" hidden>
              </button>
              <div class="nav">
                <button id="prev" class="icon" title="Previous change" aria-label="Previous change">
                </button>
                <button id="next" class="icon" title="Next change" aria-label="Next change">
                </button>
                <button id="full" class="icon" title="Read full file" aria-label="Read full file">
                </button>
              </div>
            </div>
          </header>
          <div class="body">
            <aside>
              <section id="changes-panel" aria-label="Changed files">
              <button id="changes-heading" class="side-heading" aria-expanded="true"><span>CHANGED FILES</span><span class="changes-disclosure">›</span><span id="file-count"></span></button>
              <nav id="files" aria-label="Changed files">
              </nav>
              </section>
              <section id="tree-panel" aria-label="Files">
                <button id="tree-heading" class="side-heading" aria-expanded="true"><span>FILES</span><span class="tree-chevron">›</span></button>
                <div id="tree-body"><nav id="tree" aria-label="Folder contents"></nav></div>
              </section>
            </aside>
            <main id="reader" tabindex="0" aria-label="Continuous changes">
              <div id="stream">
              </div>
              <div id="fullfile" hidden>
              </div>
              <div id="empty" hidden>No changes. A little room to think.</div>
            </main>
          </div>
          <nav id="windows" aria-label="Open Spale windows"></nav>
        </div>
        <footer class="harness">
          <span>Spale <span class="dim">/</span> sidebar study <a href="wordmark.html">Wordmark study</a></span>
          <div>
            <label for="collapse-policy">Changed files</label>
            <select id="collapse-policy" aria-label="Changed files collapse behavior">
              <option value="keep">Keep manual choice (recommended)</option>
              <option value="follow">Follow changes</option>
            </select>
            <button id="context-choice">Git repository</button>
          </div>
          <div>
            <details class="simulation"><summary>Simulate</summary><div>
            <button id="open-window">打开窗口</button>
            <button id="close-window">关闭当前窗口</button>
            <button id="new-file">新文件</button>
            <button id="stage">git add 当前文件</button>
            <button id="simulate" title="Simulate an agent update">Agent update
          </button>
          <button id="clean" title="Toggle clean state">Clean state
        </button>
            </div></details>
            <button id="appearance" title="Change appearance">System</button>
      </div>
    </footer>
    <script src="sidebar.js"></script>
    <script src="layout.js"></script>
    <script src="app.js">
    </script>
  </body>
</html>
